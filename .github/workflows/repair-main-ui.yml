name: Repair Main Web UI

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair:
    if: contains(github.event.head_commit.message, 'Main web UI repair') == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch main web UI
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          charts = Path('frontend/src/components/Charts.jsx')
          text = charts.read_text()
          old = """const tooltipStyle = {\n  background: '#161b23',\n  border: '1px solid #232b36',\n  borderRadius: 4,\n  fontSize: 12,\n  color: '#eef2f7',\n  boxShadow: '0 8px 24px -8px rgba(0,0,0,0.5)',\n}\n"""
          new = old + """\nfunction MachineHealthTooltip({ active, payload }) {\n  if (!active || !payload || payload.length === 0) return null\n  const item = payload[0]\n  const machineName = item.payload?.fullName || item.payload?.name || 'Machine'\n  return (\n    <div\n      style={{\n        ...tooltipStyle,\n        minWidth: 190,\n        maxWidth: 340,\n        padding: '9px 11px',\n      }}\n    >\n      <div style={{ color: '#eef2f7', fontWeight: 600, lineHeight: 1.35, whiteSpace: 'normal', overflowWrap: 'anywhere' }}>\n        {machineName}\n      </div>\n      <div style={{ color: '#eef2f7', marginTop: 4 }}>health: {item.value}</div>\n    </div>\n  )\n}\n"""
          if old not in text:
              raise SystemExit('Charts tooltipStyle pattern not found')
          text = text.replace(old, new, 1)

          old = """  const data = machines.map((m) => ({\n    name: m.name.length > 14 ? m.name.slice(0, 13) + '…' : m.name,\n    health: m.health_score,\n    tone: m.health_score >= 70 ? 'healthy' : m.health_score >= 40 ? 'attention' : 'critical',\n  }))\n"""
          new = """  const data = machines.map((m) => ({\n    name: m.name.length > 14 ? m.name.slice(0, 13) + '…' : m.name,\n    fullName: m.name,\n    health: m.health_score,\n    tone: m.health_score >= 70 ? 'healthy' : m.health_score >= 40 ? 'attention' : 'critical',\n  }))\n"""
          if old not in text:
              raise SystemExit('Charts data pattern not found')
          text = text.replace(old, new, 1)

          old = """        <Tooltip contentStyle={tooltipStyle} cursor={{ fill: 'rgba(255,255,255,0.03)' }} />\n"""
          new = """        <Tooltip content={<MachineHealthTooltip />} cursor={{ fill: 'rgba(255,255,255,0.03)' }} />\n"""
          if old not in text:
              raise SystemExit('Charts tooltip usage pattern not found')
          text = text.replace(old, new, 1)
          charts.write_text(text)

          machines = Path('frontend/src/pages/Machines.jsx')
          text = machines.read_text()
          old = '<td>{m.name}</td>'
          new = '<td title={m.name}>{m.name}</td>'
          if old not in text:
              raise SystemExit('Machines name cell pattern not found')
          text = text.replace(old, new, 1)
          machines.write_text(text)

          dashboard = Path('frontend/src/pages/Dashboard.jsx')
          text = dashboard.read_text()
          replacements = [
              ('<td>{m.name}</td>', '<td title={m.name}>{m.name}</td>'),
              ('<td>{p.machine_name}</td>', '<td title={p.machine_name}>{p.machine_name}</td>'),
              ('<td>{f.machine_name}</td>', '<td title={f.machine_name}>{f.machine_name}</td>'),
              ('<td>{u.name}</td>', '<td title={u.name}>{u.name}</td>'),
              ('<td>{r.name}</td>', '<td title={r.name}>{r.name}</td>'),
          ]
          for old, new in replacements:
              if old in text:
                  text = text.replace(old, new, 1)
          dashboard.write_text(text)

          css = Path('frontend/src/index.css')
          text = css.read_text()
          marker = '/* ---- Explicit form text contrast ---- */'
          if marker not in text:
              text += """\n\n/* ---- Explicit form text contrast ---- */\n.field input,\n.field select,\n.field textarea {\n  color: var(--text);\n  background: var(--panel-raised);\n}\n\n.field input::placeholder,\n.field textarea::placeholder {\n  color: var(--text-dim);\n  opacity: 1;\n}\n\n.field select option {\n  color: var(--text);\n  background: var(--panel-raised);\n}\n\n.field input:focus,\n.field select:focus,\n.field textarea:focus {\n  color: var(--text);\n}\n"""
          css.write_text(text)
          PY

      - name: Remove temporary workflow and commit UI repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/repair-main-ui.yml
          git add frontend/src/components/Charts.jsx frontend/src/pages/Machines.jsx frontend/src/pages/Dashboard.jsx frontend/src/index.css
          git commit -m "Main web UI repair [skip ci]"
          git push
