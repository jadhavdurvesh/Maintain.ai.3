name: Backend Validation

on:
  push:
    branches: [main, Lab]
  pull_request:
    branches: [main, Lab]

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile backend
        run: python -m compileall -q app
      - name: Install test runner
        run: pip install pytest

      - name: Import application and assert all routers load
        env:
          DATABASE_URL: sqlite:///./ci-maintain-ai.db
          REQUIRE_AUTH: 'false'
          CORS_ORIGINS: http://localhost:5173
        run: python -c "from app.main import app, _ROUTER_LOAD_ERRORS; assert not _ROUTER_LOAD_ERRORS, _ROUTER_LOAD_ERRORS; print(app.title)"

      - name: Run architecture regression tests
        env:
          DATABASE_URL: sqlite:///./ci-maintain-ai-test.db
          REQUIRE_AUTH: 'false'
        run: pytest -q
