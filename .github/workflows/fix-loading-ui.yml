name: Fix loading UI

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch shared skeleton and fault feedback
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64

          css = Path('frontend/src/index.css')
          current = css.read_text()
          marker = '/* ---- Reusable page loading skeleton ---- */'
          encoded = ' gZ2FwOjE0cHg7IHBhZGRpbmc6MnB4IDAgMjBweDsgfQ=='
          encoded = encoded.replace(' ', '')
          styles = base64.b64decode(encoded).decode()
          if marker not in current:
              css.write_text(current + styles)

          faults = Path('frontend/src/pages/Faults.jsx')
          text = faults.read_text()
          if "const [toast, setToast]" not in text:
              text = text.replace("const [busy, setBusy] = useState(false)", "const [busy, setBusy] = useState(false)\n  const [toast, setToast] = useState(null)")
          if "if (!toast) return" not in text:
              text = text.replace("useEffect(() => { load() }, [])", "useEffect(() => { load() }, [])\n\n  useEffect(() => {\n    if (!toast) return\n    const timer = setTimeout(() => setToast(null), 2600)\n    return () => clearTimeout(timer)\n  }, [toast])")
          text = text.replace("setForm(emptyForm); setShowForm(false); await load()", "setForm(emptyForm); setShowForm(false); await load(); setToast({ type: 'success', message: 'Fault recorded successfully.' })")
          text = text.replace("catch (e) { alert(`Could not log fault: ${e.message}`) }", "catch (e) { setToast({ type: 'error', message: `Could not log fault: ${e.message}` }) }")
          text = text.replace("try { await api.post(`/api/faults/${fault.id}/resolve`, { resolution: resolution.trim(), cause: cause?.trim() || undefined }); await load() }\n    catch (e) { alert(`Could not resolve fault: ${e.message}`) }", "try { await api.post(`/api/faults/${fault.id}/resolve`, { resolution: resolution.trim(), cause: cause?.trim() || undefined }); await load(); setToast({ type: 'success', message: 'Fault resolved successfully.' }) }\n    catch (e) { setToast({ type: 'error', message: `Could not resolve fault: ${e.message}` }) }")
          text = text.replace("      alert('Work order created from this fault.')\n      await load()", "      await load()\n      setToast({ type: 'success', message: 'Work order created successfully.' })")
          text = text.replace("catch (e) { alert(`Could not create work order: ${e.message}`) }", "catch (e) { setToast({ type: 'error', message: `Could not create work order: ${e.message}` }) }")
          text = text.replace("  return <>\n    {showForm", "  return <>\n    {toast && <div className=\"ui-toast-stack\" aria-live=\"polite\"><div className={`ui-toast ${toast.type}`}>{toast.message}</div></div>}\n    {showForm")
          faults.write_text(text)
          PY

      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/index.css frontend/src/pages/Faults.jsx
          git diff --cached --quiet || git commit -m "Improve skeleton and fault feedback"
          git push
