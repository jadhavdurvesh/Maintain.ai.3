name: MAINTAIN AI CI Validation

on:
  push:
    branches: [Lab]
  pull_request:
    branches: [Lab]
  workflow_dispatch:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_URL: https://maintain-ai-3.vercel.app
        run: npm run build

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install backend
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Compile Python
        working-directory: backend
        run: python -m compileall -q app

  desktop:
    needs: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install desktop
        working-directory: desktop
        run: npm ci
      - name: Validate Electron package configuration
        working-directory: desktop
        run: npx electron-builder --help >/dev/null
