name: Build MAINTAIN AI Desktop

on:
  workflow_dispatch:
    inputs:
      backend_url:
        description: 'Hosted MAINTAIN AI API base URL'
        required: false
        default: 'https://maintain-ai-3.vercel.app'
        type: string
      release_tag:
        description: 'GitHub Release tag'
        required: false
        default: 'v0.2.3'
        type: string
      publish_release:
        description: 'Publish only the finished installers to a GitHub Release'
        required: false
        default: true
        type: boolean
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

env:
  DEFAULT_API_URL: https://maintain-ai-3.vercel.app

jobs:
  build:
    name: Build ${{ matrix.os }} installer
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows
          - os: macos-latest
            artifact: macos
          - os: ubuntu-latest
            artifact: linux

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json

      - name: Resolve backend URL
        shell: bash
        env:
          ACTION_API_URL: ${{ inputs.backend_url }}
          REPO_API_URL: ${{ vars.MAINTAIN_AI_API_URL }}
        run: |
          API_URL="${ACTION_API_URL:-${REPO_API_URL:-${DEFAULT_API_URL}}}"
          API_URL="${API_URL%/}"
          echo "MAINTAIN_AI_API_URL=$API_URL" >> "$GITHUB_ENV"
          echo "Building desktop against: $API_URL"

      - name: Verify hosted backend health and resolve public Supabase config
        shell: bash
        run: |
          python - <<'PY'
          import json, os, sys, urllib.request
          base = os.environ['MAINTAIN_AI_API_URL']
          def get(path):
              req = urllib.request.Request(base + path, headers={'Accept': 'application/json', 'User-Agent': 'MAINTAIN-AI-CI'})
              with urllib.request.urlopen(req, timeout=10) as r:
                  if r.status != 200:
                      raise RuntimeError(f'HTTP {r.status}')
                  return json.loads(r.read().decode())
          try:
              get('/api/auth/status')
              config = get('/api/auth/public-config')
              url = str(config.get('supabase_url') or '').strip().rstrip('/')
              key = str(config.get('supabase_publishable_key') or '').strip()
              if not url.startswith('https://') or not key:
                  raise RuntimeError('Hosted backend did not return a valid public Supabase configuration')
              with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env:
                  env.write(f'VITE_SUPABASE_URL={url}\n')
                  env.write(f'VITE_SUPABASE_PUBLISHABLE_KEY={key}\n')
              print(f'Backend OK: {base}')
              print(f'Public Supabase config resolved for desktop build: {url}')
          except Exception as exc:
              print(f'Backend/config health check failed: {base}: {exc}', file=sys.stderr)
              sys.exit(1)
          PY

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Build frontend for desktop
        working-directory: frontend
        env:
          VITE_API_URL: ${{ env.MAINTAIN_AI_API_URL }}
          VITE_SUPABASE_URL: ${{ env.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ env.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Validate desktop entrypoint
        working-directory: desktop
        run: node --check main.js

      - name: Build installer
        working-directory: desktop
        env:
          MAINTAIN_AI_API_URL: ${{ env.MAINTAIN_AI_API_URL }}
        run: npm run dist

      - name: Verify installer output
        shell: bash
        run: |
          test -d desktop/dist
          case "${{ matrix.artifact }}" in
            windows) test -n "$(find desktop/dist -maxdepth 1 -type f -name '*.exe' -print -quit)" ;;
            macos) test -n "$(find desktop/dist -maxdepth 1 -type f -name '*.dmg' -print -quit)" ;;
            linux) test -n "$(find desktop/dist -maxdepth 1 -type f \( -name '*.AppImage' -o -name '*.deb' \) -print -quit)" ;;
          esac
          echo 'Finished installer files:'
          ls -lh desktop/dist/*.exe desktop/dist/*.dmg desktop/dist/*.AppImage desktop/dist/*.deb 2>/dev/null || true

      - name: Upload installer artifact only
        uses: actions/upload-artifact@v4
        with:
          name: maintain-ai-${{ matrix.artifact }}-installer
          path: |
            desktop/dist/*.exe
            desktop/dist/*.dmg
            desktop/dist/*.AppImage
            desktop/dist/*.deb
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_release == true)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download installer artifacts only
        uses: actions/download-artifact@v4
        with:
          pattern: maintain-ai-*-installer
          path: release-assets
          merge-multiple: true

      - name: Resolve release tag
        id: release-tag
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.release_tag }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then TAG="$REF_NAME"; else TAG="${INPUT_TAG:-v0.2.3}"; fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $TAG"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Remove non-installer files defensively
        shell: bash
        run: |
          find release-assets -type f ! \( -name '*.exe' -o -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' \) -delete
          echo 'Release payload:'
          find release-assets -type f -print
          test -n "$(find release-assets -type f -print -quit)"

      - name: Create or reuse GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release-tag.outputs.tag }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; reusing it."
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$TARGET_SHA" \
              --title "MAINTAIN AI $RELEASE_TAG" \
              --generate-notes
          fi

      - name: Remove stale installer assets from release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release-tag.outputs.tag }}
        shell: bash
        run: |
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | while IFS= read -r asset; do
            case "$asset" in
              *.exe|*.dmg|*.AppImage|*.deb) ;;
              *) echo "Removing stale non-installer asset: $asset"; gh release delete-asset "$RELEASE_TAG" "$asset" --repo "$GITHUB_REPOSITORY" --yes ;;
            esac
          done

      - name: Upload installers to release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release-tag.outputs.tag }}
        shell: bash
        run: |
          for file in release-assets/*; do
            [ -f "$file" ] || continue
            echo "Uploading: $file"
            gh release upload "$RELEASE_TAG" "$file" --repo "$GITHUB_REPOSITORY" --clobber
          done

      - name: Verify published release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release-tag.outputs.tag }}
        run: |
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json name,tagName,url,assets
