name: MAINTAIN AI Desktop Build\n\non:\n  workflow_dispatch:\n  push:\n    tags:\n      - 'v*'\n\npermissions:\n  contents: write\n\njobs:\n  build:\n    name: Build ${{ matrix.os }}\n    runs-on: ${{ matrix.os }}\n    strategy:\n      fail-fast: false\n      matrix:\n        os:\n          - windows-latest\n          - macos-latest\n          - ubuntu-latest\n\n    steps:\n      - name: Checkout\n        uses: actions/checkout@v4\n\n      - name: Setup Node.js\n        uses: actions/setup-node@v4\n        with:\n          node-version: 20\n          cache: npm\n          cache-dependency-path: |\n            frontend/package-lock.json\n            desktop/package-lock.json\n\n      - name: Install frontend dependencies\n        working-directory: frontend\n        run: npm ci\n\n      - name: Build frontend for hosted backend\n        working-directory: frontend\n        env:\n          VITE_API_URL: ${{ vars.MAINTAIN_AI_API_URL || 'https://maintain-ai-3.vercel.app' }}\n        run: npm run build\n\n      - name: Install desktop dependencies\n        working-directory: desktop\n        run: npm ci\n\n      - name: Build installer\n        working-directory: desktop\n        run: npm run dist\n\n      - name: Upload installer\n        uses: actions/upload-artifact@v4\n        with:\n          name: maintain-ai-${{ matrix.os }}\n          path: desktop/dist/*\n          if-no-files-found: error\n          retention-days: 30\n\n  release:\n    name: Publish GitHub Release\n    if: startsWith(github.ref, 'refs/tags/v')\n    needs: build\n    runs-on: ubuntu-latest\n\n    steps:\n      - name: Download all installers\n        uses: actions/download-artifact@v4\n        with:\n          path: release-assets\n          merge-multiple: true\n\n      - name: Publish release\n        env:\n          GH_TOKEN: ${{ github.token }}\n        run: |\n          gh release create "${GITHUB_REF_NAME}" release-assets/* \\n            --title "MAINTAIN AI ${GITHUB_REF_NAME}" \\n            --generate-notes\n